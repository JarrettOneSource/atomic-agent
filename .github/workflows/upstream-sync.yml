name: Weekly upstream update

on:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atomic-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'AtomicBot-ai/atomic-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      conflict: ${{ steps.merge.outputs.conflict }}
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Prepare the upstream candidate
        id: merge
        env:
          SYNC_BRANCH: automation/upstream-sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/AtomicBot-ai/atomic-agent.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -C "$SYNC_BRANCH"
          conflict=false
          if ! git merge --no-ff --no-edit upstream/main; then
            git merge --abort
            # A draft PR against the custom branch exposes GitHub's conflict
            # list without discarding or deploying any custom-branch changes.
            git switch -C "$SYNC_BRANCH" upstream/main
            conflict=true
          fi
          # This branch belongs exclusively to the update workflow. The lease
          # prevents a push racing another writer; the custom branch is untouched.
          git push --force-with-lease origin "HEAD:refs/heads/$SYNC_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "conflict=$conflict" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: sync
    if: needs.sync.outputs.changed == 'true' && needs.sync.outputs.conflict == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}

  review:
    needs: [sync, checks]
    if: always() && needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Open or update the review PR
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/upstream-sync
          SYNC_BASE: ${{ github.event.repository.default_branch }}
          SYNC_SHA: ${{ needs.sync.outputs.sha }}
          SYNC_CONFLICT: ${{ needs.sync.outputs.conflict }}
          VALIDATION_RESULT: ${{ needs.checks.result }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          export SYNC_RUN_URL="$run_url"
          python3 - <<'PY'
          import os
          from pathlib import Path
          conflict = os.environ['SYNC_CONFLICT'] == 'true'
          validation = 'Merge conflicts need resolution; checks were not run.' if conflict else 'Validation: ' + os.environ['VALIDATION_RESULT'] + '.'
          Path('body.md').write_text(
              'Updates the Atomic fork with changes from AtomicBot-ai/atomic-agent.\n\n'
              + validation + '\n\n'
              + '[Workflow results](' + os.environ['SYNC_RUN_URL'] + ')\n\n'
              + 'Review and merge this PR before rebuilding and restarting the hub. '
              + 'This workflow does not connect to or update any of the model hosts.\n'
          )
          PY
          state=failure
          if [ "$VALIDATION_RESULT" = success ] && [ "$SYNC_CONFLICT" = false ]; then
            state=success
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SYNC_SHA" --method POST \
            -f state="$state" -f context='Upstream merge validation' \
            -f description='See the weekly update workflow results' -f target_url="$run_url"
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title 'Update Atomic from upstream' --body-file body.md
          elif [ "$state" = success ]; then
            pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$SYNC_BASE" --head "$SYNC_BRANCH" --title 'Update Atomic from upstream' --body-file body.md)
          else
            pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$SYNC_BASE" --head "$SYNC_BRANCH" --title 'Update Atomic from upstream' --body-file body.md --draft)
          fi
          draft=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$state" = success ] && [ "$draft" = true ]; then
            gh pr ready "$pr" --repo "$GITHUB_REPOSITORY"
          elif [ "$state" != success ] && [ "$draft" = false ]; then
            gh pr ready "$pr" --repo "$GITHUB_REPOSITORY" --undo
          fi
